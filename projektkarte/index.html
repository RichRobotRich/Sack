<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projektkarte</title>
<link rel="icon" href="favicon-32.png">
<link rel="stylesheet" href="karte.css">
</head>
<body>

<header class="kopfzeile">
  <button class="knopf-lupe" id="knopfSuche" aria-label="Projekte suchen"
          aria-expanded="false" title="Projekte suchen">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path>
    </svg>
  </button>
  <div class="marke">
    <img id="logo" src="logo.png" alt="" onload="this.classList.add('da')" onerror="this.remove()">
    <div class="titel" id="seitentitel">Unsere Projekte in Deutschland</div>
  </div>
  <div class="kopf-luecke"></div>
</header>

<div class="inhalt">

  <main class="kartenfeld" id="kartenfeld">

    <div class="suchtafel" id="suchtafel" role="dialog" aria-label="Projekte suchen">
      <div class="suchfeld">
        <input type="search" id="suche" placeholder="Projekt oder Ort suchen&hellip;"
               autocomplete="off" aria-controls="liste">
      </div>
      <div class="liste" id="liste"></div>
    </div>

    <svg id="karte" role="img" aria-label="Karte von Deutschland mit unseren Projekten">
      <g id="ebene">
          <g id="ebeneKacheln"></g>
        <g id="ebeneLaender"></g>
          <g id="ebeneMarker"></g>
      </g>
    </svg>

    <div class="kartenhinweis" id="kartenhinweis" hidden>
      Straßenkarte hier nicht verfügbar &ndash; sie braucht eine Verbindung zum
      Kartendienst.
    </div>

    <div class="kartenherkunft" id="kartenherkunft" hidden>
      Kartendaten &copy; <a href="https://www.openstreetmap.org/copyright"
      target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende
    </div>

    <div class="legende">
      <span><i></i> Projekte</span>
      <span><i class="eckig"></i> Betriebssitze</span>
      <span><i class="fern"></i> Fernaufschaltungen</span>
    </div>

    <div class="kartensteuerung">
      <button id="knopfPlus" title="Vergrößern" aria-label="Vergrößern">+</button>
      <button id="knopfMinus" title="Verkleinern" aria-label="Verkleinern">&minus;</button>
      <button id="knopfHeim" title="Ganz Deutschland zeigen" aria-label="Ganz Deutschland zeigen">&#8635;</button>
    </div>
  </main>

  <section class="tafel" id="tafel" aria-hidden="true">
    <div class="tafel-kopf">
      <button class="tafel-schliessen" id="tafelSchliessen" aria-label="Schließen">&times;</button>
    </div>
    <div class="tafel-inhalt" id="tafelInhalt"></div>
  </section>

</div>

<!-- Bildansicht -->
<div class="lichtkasten" id="lichtkasten" role="dialog" aria-label="Bildansicht">
  <button class="zu" id="lkZu" aria-label="Schließen">&times;</button>
  <button class="zurueck" id="lkZurueck" aria-label="Vorheriges Bild">&#8249;</button>
  <img id="lkBild" alt="">
  <button class="vor" id="lkVor" aria-label="Nächstes Bild">&#8250;</button>
  <div class="bildtext" id="lkText"></div>
</div>

<div class="meldung" id="meldung"></div>

<script src="geo-deutschland.js"></script>
<script src="karte.js"></script>
</body>
</html>
