<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leniger Projektkarte</title>
<style>
/* Projektkarte - Layout und Erscheinungsbild */

:root {
  --blau: #1d4ed8;
  --blau-hell: #3b82f6;
  --blau-dunkel: #172554;
  --sitz: #0f172a;
  --fern: #dc2626;
  --fern-hell: #ef4444;
  --text: #0f172a;
  --text-leise: #64748b;
  --linie: #e2e8f0;
  --flaeche: #f1f5f9;
  --karte-land: #ffffff;
  --karte-grenze: #b6c4d6;
  --karte-hintergrund: #eef2f7;
  --schatten: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .08);
  --radius: 12px;
  --kopf: 60px;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  color: var(--text);
  background: var(--flaeche);
  overflow: hidden;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

/* ---------------------------------------------------------------- Grundgeruest */

.kopfzeile {
  height: var(--kopf);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 16px;
  background: #fff;
  border-bottom: 1px solid var(--linie);
  position: relative;
  z-index: 30;
}

.marke {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.marke img { height: 30px; width: auto; display: none; }
.marke img.da { display: block; }

.marke .titel {
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.kopf-luecke { flex: 1; }

.inhalt {
  display: flex;
  height: calc(100% - var(--kopf));
  position: relative;
}

/* ---------------------------------------------------------------- Suche */

.knopf-lupe {
  width: 36px;
  height: 36px;
  flex: 0 0 auto;
  border-radius: 10px;
  border: 1px solid var(--linie);
  background: #fff;
  color: var(--text);
  cursor: pointer;
  display: grid;
  place-items: center;
}

.knopf-lupe:hover { background: var(--flaeche); }

.knopf-lupe[aria-expanded="true"] {
  background: var(--blau);
  border-color: var(--blau);
  color: #fff;
}

.suchtafel {
  position: absolute;
  top: 14px;
  left: 14px;
  width: 330px;
  max-width: calc(100% - 28px);
  max-height: calc(100% - 28px);
  background: #fff;
  border: 1px solid var(--linie);
  border-radius: 14px;
  box-shadow: var(--schatten);
  display: flex;
  flex-direction: column;
  z-index: 22;
  overflow: hidden;
  opacity: 0;
  transform: translateY(-8px);
  pointer-events: none;
  transition: opacity .16s ease, transform .16s ease;
}

.suchtafel.offen {
  opacity: 1;
  transform: none;
  pointer-events: auto;
}

.suchfeld {
  padding: 10px;
  border-bottom: 1px solid var(--linie);
}

.suchfeld input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--linie);
  border-radius: 9px;
  background: var(--flaeche);
  outline: none;
}

.suchfeld input:focus {
  border-color: var(--blau-hell);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
}

.liste {
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 6px;
  flex: 1;
  min-height: 0;
}

.listen-titel {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-leise);
  padding: 12px 8px 5px;
}

.listen-titel:first-child { padding-top: 6px; }

.eintrag {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  padding: 9px 10px;
  border: 0;
  background: transparent;
  border-radius: 9px;
  cursor: pointer;
}

.eintrag:hover,
.eintrag.markiert { background: var(--flaeche); }
.eintrag.aktiv { background: rgba(29, 78, 216, .09); }
.eintrag:focus-visible {
  outline: 2px solid var(--blau-hell);
  outline-offset: -2px;
}

.eintrag .punkt {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--blau);
  flex: 0 0 auto;
}

.eintrag.sitz .punkt {
  border-radius: 3px;
  background: var(--sitz);
}

.eintrag.fernaufschaltung .punkt { background: var(--fern); }

.eintrag .beschriftung {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.eintrag .name {
  font-size: 14px;
  font-weight: 550;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.eintrag .ort {
  font-size: 12px;
  color: var(--text-leise);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.leer {
  padding: 24px 12px;
  color: var(--text-leise);
  font-size: 13px;
  text-align: center;
}

/* ---------------------------------------------------------------- Karte */

.kartenfeld {
  flex: 1;
  position: relative;
  background: var(--karte-hintergrund);
  overflow: hidden;
  min-width: 0;
}

#karte {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}

#karte.zieht { cursor: grabbing; }
#karte.setzt { cursor: crosshair; }

.land {
  fill: var(--karte-land);
  stroke: var(--karte-grenze);
  stroke-width: 1.2;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
  transition: fill .25s ease;
}

/* Sobald die Straßenkarte liegt, bleiben von den Ländern nur die Grenzen. */
#karte.mit-strassen .land {
  fill: transparent;
  stroke: rgba(15, 23, 42, .35);
  stroke-width: 1.6;
}

#ebeneKacheln {
  opacity: 0;
  transition: opacity .3s ease;
  pointer-events: none;
}

#karte.mit-strassen #ebeneKacheln { opacity: 1; }

.kachel { image-rendering: -webkit-optimize-contrast; }

.kartenherkunft {
  position: absolute;
  left: 14px;
  bottom: 58px;
  font-size: 11px;
  color: var(--text-leise);
  background: rgba(255, 255, 255, .9);
  padding: 3px 8px;
  border-radius: 6px;
  z-index: 5;
}

.kartenherkunft a { color: inherit; }

.kartenhinweis {
  position: absolute;
  top: 14px;
  right: 14px;
  max-width: 240px;
  font-size: 12px;
  line-height: 1.45;
  color: var(--text-leise);
  background: rgba(255, 255, 255, .94);
  border: 1px solid var(--linie);
  padding: 8px 11px;
  border-radius: 9px;
  box-shadow: var(--schatten);
  z-index: 5;
}

.kartenfeld.tafel-offen .kartenhinweis { right: 474px; }

@media (max-width: 900px) {
  .kartenfeld.tafel-offen .kartenhinweis { right: 14px; }
}

.marker { cursor: pointer; }
.marker .treffer { fill: transparent; }
.marker .schatten { fill: rgba(15, 23, 42, .18); }
.marker .stift { fill: var(--blau); }
.marker .kern { fill: #fff; }
.marker.sitz .stift { fill: var(--sitz); }
.marker.fernaufschaltung .stift { fill: var(--fern); }
.marker:hover .stift { fill: var(--blau-hell); }
.marker.sitz:hover .stift { fill: #334155; }
.marker.fernaufschaltung:hover .stift { fill: var(--fern-hell); }

.marker .welle {
  fill: none;
  stroke: #fff;
  stroke-width: 1.5;
  stroke-linecap: round;
}
/* Der gewählte Marker wird dunkler, behält aber die Farbe seiner Art. */
.marker.gewaehlt .stift { fill: var(--blau-dunkel); }
.marker.sitz.gewaehlt .stift { fill: #000; }
.marker.fernaufschaltung.gewaehlt .stift { fill: #7f1d1d; }

.marker .name {
  font-size: 11px;
  font-weight: 600;
  fill: var(--text);
  paint-order: stroke;
  stroke: rgba(255, 255, 255, .92);
  stroke-width: 3.5px;
  stroke-linejoin: round;
  text-anchor: middle;
  pointer-events: none;
  opacity: 0;
  transition: opacity .12s;
}

.marker.zeigt-namen .name,
.marker:hover .name { opacity: 1; }

.kartensteuerung {
  position: absolute;
  right: 14px;
  bottom: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 5;
}

.kartensteuerung button {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--linie);
  background: #fff;
  box-shadow: var(--schatten);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 18px;
  line-height: 1;
}

.kartensteuerung button:hover { background: var(--flaeche); }

/* Bei geöffneter Detailtafel wandert die Steuerung neben die Tafel. */
.kartenfeld.tafel-offen .kartensteuerung { right: 474px; }

.legende {
  position: absolute;
  left: 14px;
  bottom: 14px;
  background: rgba(255, 255, 255, .94);
  border: 1px solid var(--linie);
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 12px;
  box-shadow: var(--schatten);
  display: flex;
  gap: 16px;
  z-index: 5;
}

.legende span { display: flex; align-items: center; gap: 7px; }
.legende i { width: 11px; height: 11px; border-radius: 50%; background: var(--blau); }
.legende i.eckig { border-radius: 3px; background: var(--sitz); }
.legende i.fern { background: var(--fern); }

.hinweisleiste {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--blau-dunkel);
  color: #fff;
  padding: 9px 16px;
  border-radius: 999px;
  font-size: 13px;
  box-shadow: var(--schatten);
  z-index: 6;
  display: flex;
  align-items: center;
  gap: 12px;
}

/* ---------------------------------------------------------------- Schaltflaechen */

.knopf {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: 9px;
  border: 1px solid var(--linie);
  background: #fff;
  cursor: pointer;
  font-size: 14px;
  font-weight: 550;
  white-space: nowrap;
}

.knopf:hover { background: var(--flaeche); }

.knopf.haupt {
  background: var(--blau);
  border-color: var(--blau);
  color: #fff;
}
.knopf.haupt:hover { background: #1e40af; }

.knopf.leise {
  border-color: transparent;
  background: transparent;
  color: var(--text-leise);
}
.knopf.leise:hover { background: var(--flaeche); color: var(--text); }

.knopf.gefahr { color: #b91c1c; border-color: #fecaca; background: #fef2f2; }
.knopf.gefahr:hover { background: #fee2e2; }

.knopf.klein { padding: 5px 10px; font-size: 13px; }
.knopf:disabled { opacity: .5; cursor: not-allowed; }

/* ---------------------------------------------------------------- Detailtafel */

.tafel {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 460px;
  max-width: 100%;
  background: #fff;
  border-left: 1px solid var(--linie);
  box-shadow: -12px 0 32px rgba(15, 23, 42, .08);
  transform: translateX(102%);
  transition: transform .28s cubic-bezier(.4, 0, .2, 1);
  z-index: 20;
  display: flex;
  flex-direction: column;
}

.tafel.offen { transform: none; }

.tafel-kopf {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 2;
}

.tafel-schliessen {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 0;
  background: rgba(255, 255, 255, .9);
  box-shadow: var(--schatten);
  cursor: pointer;
  font-size: 17px;
  line-height: 1;
}

.tafel-inhalt {
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

.titelbild {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  background: var(--flaeche);
  display: block;
}

.tafel-text { padding: 20px; }

.tafel-marke {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--blau);
  margin-bottom: 6px;
}

.tafel-marke.sitz { color: var(--sitz); }
.tafel-marke.fernaufschaltung { color: var(--fern); }

.tafel h2 {
  margin: 0 0 4px;
  font-size: 21px;
  letter-spacing: -.01em;
}

.tafel .unterzeile {
  color: var(--text-leise);
  font-size: 14px;
  margin-bottom: 18px;
}

.eckdaten {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  background: var(--linie);
  border: 1px solid var(--linie);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
}

.eckdaten div { background: #fff; padding: 11px 13px; }
.eckdaten dt {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--text-leise);
  font-weight: 600;
}
.eckdaten dd { margin: 3px 0 0; font-size: 15px; font-weight: 550; }

.beschreibung { line-height: 1.62; font-size: 14.5px; }
.beschreibung p { margin: 0 0 12px; }

.abschnitt-titel {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--text-leise);
  margin: 24px 0 10px;
}

.galerie {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.galerie figure { margin: 0; }

.galerie img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: 9px;
  background: var(--flaeche);
  cursor: zoom-in;
  display: block;
}

.galerie figcaption {
  font-size: 12px;
  color: var(--text-leise);
  margin-top: 4px;
}

/* ---------------------------------------------------------------- Lichtkasten */

.lichtkasten {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, .88);
  z-index: 90;
  display: none;
  align-items: center;
  justify-content: center;
}

.lichtkasten.offen { display: flex; }
.lichtkasten img { max-width: 92vw; max-height: 84vh; border-radius: 8px; }

.lichtkasten .bildtext {
  position: absolute;
  bottom: 22px;
  left: 0;
  right: 0;
  text-align: center;
  color: #fff;
  font-size: 14px;
  padding: 0 60px;
}

.lichtkasten button {
  position: absolute;
  border: 0;
  background: rgba(255, 255, 255, .16);
  color: #fff;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
}

.lichtkasten button:hover { background: rgba(255, 255, 255, .28); }
.lichtkasten .zu { top: 18px; right: 18px; }
.lichtkasten .vor { right: 18px; top: 50%; transform: translateY(-50%); }
.lichtkasten .zurueck { left: 18px; top: 50%; transform: translateY(-50%); }

/* ---------------------------------------------------------------- Dialoge */

.schleier {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, .45);
  z-index: 60;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.schleier.offen { display: flex; }

.dialog {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 24px 60px rgba(15, 23, 42, .25);
  width: 100%;
  max-width: 440px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.dialog.breit { max-width: 900px; }

.dialog-kopf {
  padding: 16px 20px;
  border-bottom: 1px solid var(--linie);
  display: flex;
  align-items: center;
  gap: 12px;
}

.dialog-kopf h3 { margin: 0; font-size: 17px; flex: 1; }

.dialog-koerper {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
  min-height: 0;
}

.dialog-fuss {
  padding: 14px 20px;
  border-top: 1px solid var(--linie);
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  background: #fcfdfe;
}

/* ---------------------------------------------------------------- Formulare */

.feld { margin-bottom: 14px; }

.feld > label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  margin-bottom: 5px;
  color: #334155;
}

.feld input[type="text"],
.feld input[type="password"],
.feld input[type="number"],
.feld textarea,
.feld select {
  width: 100%;
  padding: 9px 11px;
  border: 1px solid var(--linie);
  border-radius: 9px;
  background: #fff;
  outline: none;
}

.feld textarea { min-height: 130px; resize: vertical; line-height: 1.55; }

.feld input:focus, .feld textarea:focus, .feld select:focus {
  border-color: var(--blau-hell);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, .15);
}

.feld .hilfe { font-size: 12px; color: var(--text-leise); margin-top: 5px; }

.reihe { display: flex; gap: 12px; }
.reihe > * { flex: 1; min-width: 0; }

.fehler {
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #b91c1c;
  padding: 9px 12px;
  border-radius: 9px;
  font-size: 13px;
  margin-bottom: 14px;
}

.erfolg {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  color: #15803d;
  padding: 9px 12px;
  border-radius: 9px;
  font-size: 13px;
  margin-bottom: 14px;
}

/* Eckdaten-Reihen im Editor */

.daten-reihe {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}

.daten-reihe input { flex: 1; min-width: 0; }
.daten-reihe .griff { color: var(--text-leise); cursor: default; font-size: 13px; }

.bild-reihe {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 8px;
  border: 1px solid var(--linie);
  border-radius: 10px;
  margin-bottom: 8px;
}

.bild-reihe img {
  width: 72px;
  height: 54px;
  object-fit: cover;
  border-radius: 6px;
  background: var(--flaeche);
  flex: 0 0 auto;
}

.bild-reihe input { flex: 1; min-width: 0; }

.vorschau-titelbild {
  width: 100%;
  max-width: 340px;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  border-radius: 10px;
  background: var(--flaeche);
  border: 1px solid var(--linie);
  margin-bottom: 8px;
  display: block;
}

/* ---------------------------------------------------------------- Verwaltung */

.reiter {
  display: flex;
  gap: 4px;
  padding: 0 20px;
  border-bottom: 1px solid var(--linie);
  background: #fff;
}

.reiter button {
  border: 0;
  background: transparent;
  padding: 12px 12px 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 550;
  color: var(--text-leise);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}

.reiter button.aktiv { color: var(--blau); border-bottom-color: var(--blau); }

.verwaltung-liste { display: flex; flex-direction: column; gap: 8px; }

.verwaltung-zeile {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border: 1px solid var(--linie);
  border-radius: 10px;
}

.verwaltung-zeile img {
  width: 56px;
  height: 42px;
  object-fit: cover;
  border-radius: 6px;
  background: var(--flaeche);
  flex: 0 0 auto;
}

.verwaltung-zeile .beschriftung { flex: 1; min-width: 0; }
.verwaltung-zeile .name { font-weight: 600; font-size: 14px; }
.verwaltung-zeile .ort { font-size: 12.5px; color: var(--text-leise); }

.speicher-balken {
  height: 7px;
  border-radius: 4px;
  background: var(--linie);
  overflow: hidden;
  margin: 8px 0 6px;
}

.speicher-balken i { display: block; height: 100%; background: var(--blau); }

.meldung {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translate(-50%, 20px);
  background: var(--blau-dunkel);
  color: #fff;
  padding: 11px 18px;
  border-radius: 999px;
  font-size: 14px;
  box-shadow: var(--schatten);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 100;
}

.meldung.sichtbar { opacity: 1; transform: translate(-50%, 0); }

/* ---------------------------------------------------------------- Schmale Fenster */

@media (max-width: 900px) {
  .suchtafel {
    top: 10px;
    left: 10px;
    right: 10px;
    width: auto;
    max-width: none;
  }

  .tafel { width: 100%; }
  .kartenfeld.tafel-offen .kartensteuerung { right: 14px; }
  .legende { font-size: 11px; padding: 7px 10px; gap: 12px; }
  .marke .titel { font-size: 15px; }
}
</style>
</head>
<body>
<header class="kopfzeile">
  <button class="knopf-lupe" id="knopfSuche" aria-label="Projekte suchen"

  /** Farbiger Platzhalter, solange kein Bild hinterlegt ist. */
  function platzhalter(text, ton) {
    var kuerzel = String(text || '?').trim().split(/\s+/).slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); }).join('');
    var farben = TOENE[ton] || TOENE.blau;
    var a = farben[0];
    var b = farben[1];
    var quelle = '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360">' +
      '<defs><linearGradient id="v" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="' + a + '"/><stop offset="1" stop-color="' + b + '"/>' +
      '</linearGradient></defs><rect width="640" height="360" fill="url(#v)"/>' +
      '<text x="320" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="96" font-weight="700" ' +
      'fill="rgba(255,255,255,.85)" text-anchor="middle">' + kuerzel + '</text></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(quelle);

  /* ------------------------------------------------------------ Kennwort */

  function einfacherHash(text) {
    var wert = 5381;
    for (var i = 0; i < text.length; i++) wert = ((wert * 33) ^ text.charCodeAt(i)) >>> 0;
    return wert.toString(16);
  }

  function hashe(text) {
    var gesalzen = 'projektkarte$' + text;
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(gesalzen))
        .then(function (puffer) {
          return Array.prototype.map.call(new Uint8Array(puffer), function (b) {
            return ('0' + b.toString(16)).slice(-2);
          }).join('');
        })
        .catch(function () { return 'e:' + einfacherHash(gesalzen); });
    }
    return Promise.resolve('e:' + einfacherHash(gesalzen));
  }

  function passwortStimmt(eingabe) {
    return hashe(eingabe).then(function (hash) {

      if (!hinterlegt) return eingabe === STANDARD_PASSWORT;

  var ARTEN = {

  /** Sorgt dafür, dass auch ältere oder eingelesene Daten vollständig sind. */
  function raeumeAuf(roh) {
    var d = roh && typeof roh === 'object' ? roh : {};
    var sauber = {
      version: 1,
      einstellungen: {
        seitentitel: (d.einstellungen && d.einstellungen.seitentitel) || 'Unsere Projekte in Deutschland',
        passwortHash: (d.einstellungen && d.einstellungen.passwortHash) || null,
        ruheSekunden: Math.max(0, Math.min(3600,
          Math.round(zahl(d.einstellungen && d.einstellungen.ruheSekunden, RUHE_STANDARD))))
      },
      sitze: (Array.isArray(d.sitze) ? d.sitze : []).map(eintragAufraeumen),
      projekte: (Array.isArray(d.projekte) ? d.projekte : []).map(eintragAufraeumen),
      // Ältere Sicherungen kennen die Fernaufschaltungen noch nicht.
      fernaufschaltungen: (Array.isArray(d.fernaufschaltungen) ? d.fernaufschaltungen : [])
        .map(eintragAufraeumen)
    };
    return sauber;
  }

  function eintragAufraeumen(e) {
    e = e || {};
    return {
      id: e.id || neueId(),
      name: String(e.name || 'Ohne Namen'),
      ort: String(e.ort || ''),
      lat: zahl(e.lat, 51.2),
      lon: zahl(e.lon, 10.4),
      titelbild: String(e.titelbild || ''),
      fakten: (Array.isArray(e.fakten) ? e.fakten : [])
        .filter(function (f) { return f && (f.label || f.wert); })
        .map(function (f) { return { label: String(f.label || ''), wert: String(f.wert || '') }; }),
      text: String(e.text || ''),
      bilder: (Array.isArray(e.bilder) ? e.bilder : [])
        .filter(function (b) { return b && b.src; })
        .map(function (b) { return { src: String(b.src), text: String(b.text || '') }; })
    };
  }

  var daten = laden();

  function laden() {
    try {
      var roh = localStorage.getItem(SPEICHER);
      if (roh) return raeumeAuf(JSON.parse(roh));
    } catch (e) { /* beschädigt oder gesperrt - dann mit Demodaten starten */ }
    return demodaten();
  }

  function speichern() {
    try {
      localStorage.setItem(SPEICHER, JSON.stringify(daten));
      return true;
    } catch (e) {
      melde('Speicher voll - bitte Bilder verkleinern oder Einträge sichern und aufräumen.');
      return false;
    }
  }

  function speicherGroesse() {
    try { return (localStorage.getItem(SPEICHER) || '').length; } catch (e) { return 0; }
  }

  /**
   * Alle Einträge mit Kennzeichnung ihrer Art. Die Reihenfolge bestimmt, was
   * auf der Karte obenauf liegt - die Betriebssitze kommen deshalb zuletzt.
   */
  function alleOrte() {
    var orte = [];
    ['fernaufschaltung', 'projekt', 'sitz'].forEach(function (art) {
      listeFuer(art).forEach(function (e) {
        orte.push(Object.assign({ art: art }, e));
      });
    });
    return orte;
  }

  function findeOrt(id) {
    return alleOrte().filter(function (o) { return o.id === id; })[0] || null;
  }

  /* ------------------------------------------------------------ Projektion */

  function projiziere(lat, lon) {
    var y = Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2)) * 180 / Math.PI;
    return { x: (lon - G.minX) * G.scale, y: (G.maxY - y) * G.scale };
  }

  function entprojiziere(x, y) {
    var lon = x / G.scale + G.minX;
    var my = G.maxY - y / G.scale;
    var lat = (2 * Math.atan(Math.exp(my * Math.PI / 180)) - Math.PI / 2) * 180 / Math.PI;
    return { lat: Math.round(lat * 1e5) / 1e5, lon: Math.round(lon * 1e5) / 1e5 };
  }

  /* ------------------------------------------------------------ Karte */

  var karte = $('#karte');
  var ebene = $('#ebene');
  var ebeneKacheln = $('#ebeneKacheln');
  var ebeneLaender = $('#ebeneLaender');
  var ebeneMarker = $('#ebeneMarker');

  var ansicht = { x: 0, y: 0, k: 1 };
  var K_MIN = 0.7, K_MAX = 4000;
  var gewaehlteId = null;
  var setzeModus = null;   // Rückruf, wenn eine Position auf der Karte gewählt wird

  karte.setAttribute('viewBox', '0 0 ' + G.w + ' ' + G.h);

  /* ---- Straßenkarte
   *
   * Die Umrisse sind mercator-projiziert und damit dasselbe Koordinatensystem,
   * das auch Kartenkacheln benutzen - die Kacheln passen deshalb ohne Umrechnung
   * darüber. Sie liegen in derselben verschobenen Ebene wie alles andere, also
   * muss beim Zoomen nichts nachgeführt werden.
   *
   * Ab KACHEL_AB wird umgeschaltet: darunter die weiße Karte, darüber die
   * Straßen. Lässt sich keine Kachel laden - kein Netz, oder die Seite läuft
   * in einer Umgebung, die fremde Bilder blockiert -, bleibt es bei der weißen
   * Karte, und der Zoom funktioniert trotzdem.
   */
  var KACHEL_QUELLE = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  var KACHEL_AB = 9;          // Kachel-Zoomstufe, ab der Straßen erscheinen
  var KACHEL_MAX = 19;
  var kachelnMoeglich = true;
  var kachelnAn = false;
  var kachelGeladen = false;
  var kachelFehlschlaege = 0;
  var kachelLauf = null;

  /** Bildpunkte je Karteneinheit - abhängig von der Größe des Kartenfelds. */
  function punkteJeEinheit() {
    var r = karte.getBoundingClientRect();
    if (!r.width || !r.height) return 1;
    return Math.min(r.width / G.w, r.height / G.h);
  }

  /** Die Kachel-Zoomstufe, bei der eine Kachel etwa 256 Bildpunkte groß ist. */
  function kachelZoom() {
    var z = Math.log(360 * G.scale * punkteJeEinheit() * ansicht.k / 256) / Math.LN2;
    return Math.max(0, Math.min(KACHEL_MAX, Math.round(z)));
  }

  /** Der sichtbare Ausschnitt in Karteneinheiten, ohne Verschiebung. */
  function sichtbarerBereich() {
    var r = karte.getBoundingClientRect();
    var a = zuKarte(r.left, r.top);
    var b = zuKarte(r.right, r.bottom);
    return {
      x0: (a.x - ansicht.x) / ansicht.k,
      y0: (a.y - ansicht.y) / ansicht.k,
      x1: (b.x - ansicht.x) / ansicht.k,
      y1: (b.y - ansicht.y) / ansicht.k
    };
  }

  /** Waagerechte Kachelnummer zu einer Karteneinheit und umgekehrt. */
  function xZuKachel(x, teile) {
    return ((x / G.scale + G.minX) + 180) / 360 * teile;
  }

  function kachelZuX(tx, teile) {
    return (tx / teile * 360 - 180 - G.minX) * G.scale;
  }

  function yZuKachel(y, teile) {
    var merc = G.maxY - y / G.scale;
    return (1 - merc / 180) / 2 * teile;
  }

  function kachelZuY(ty, teile) {
    return (G.maxY - 180 * (1 - 2 * ty / teile)) * G.scale;
  }

  function zeichneKacheln() {
    var z = kachelZoom();

    if (!kachelnMoeglich) {
      // Ohne Kacheln bleibt die weiße Karte - beim Hineinzoomen erklärt ein
      // Hinweis, warum hier keine Straßen kommen.
      $('#kartenhinweis').hidden = z < KACHEL_AB;
      return;
    }

    var anZeigen = z >= KACHEL_AB;
    if (anZeigen !== kachelnAn) {
      kachelnAn = anZeigen;
      karte.classList.toggle('mit-strassen', anZeigen);
      $('#kartenherkunft').hidden = !anZeigen;
      $('#kartenhinweis').hidden = true;
    }
    if (!anZeigen) { ebeneKacheln.textContent = ''; return; }

    var teile = Math.pow(2, z);
    var kante = 360 * G.scale / teile;
    var b = sichtbarerBereich();

    var von_x = Math.max(0, Math.floor(xZuKachel(b.x0, teile)));
    var bis_x = Math.min(teile - 1, Math.floor(xZuKachel(b.x1, teile)));
    var von_y = Math.max(0, Math.floor(yZuKachel(b.y0, teile)));
    var bis_y = Math.min(teile - 1, Math.floor(yZuKachel(b.y1, teile)));
    if (bis_x < von_x || bis_y < von_y) return;
    // Notbremse, falls die Rechnung durch eine seltsame Fenstergröße entgleist.
    if ((bis_x - von_x + 1) * (bis_y - von_y + 1) > 240) return;

    // Je Zoomstufe eine eigene Gruppe: die alte bleibt stehen, bis die neue
    // geladen ist, sonst blitzt beim Zoomen der weiße Untergrund durch.
    var gruppe = ebeneKacheln.querySelector('[data-z="' + z + '"]');
    if (!gruppe) {
      gruppe = svg('g', { 'data-z': z });
      ebeneKacheln.appendChild(gruppe);
    }

    var gebraucht = {};
    for (var tx = von_x; tx <= bis_x; tx++) {
      for (var ty = von_y; ty <= bis_y; ty++) {
        var schluessel = tx + '_' + ty;
        gebraucht[schluessel] = true;
        if (gruppe.querySelector('[data-k="' + schluessel + '"]')) continue;

        var bild = svg('image', {
          'data-k': schluessel,
          class: 'kachel',
          x: kachelZuX(tx, teile),
          y: kachelZuY(ty, teile),
          // Winzige Überlappung, sonst blitzen die Fugen zwischen den Kacheln.
          width: kante * 1.002,
          height: kante * 1.002
        });
        bild.addEventListener('load', function () { kachelGeladen = true; });
        bild.addEventListener('error', kachelFehler);
        bild.setAttributeNS('http://www.w3.org/1999/xlink', 'href', kachelUrl(z, tx, ty));
        bild.setAttribute('href', kachelUrl(z, tx, ty));
        gruppe.appendChild(bild);
      }
    }

    // Kacheln außerhalb des Ausschnitts wieder freigeben.
    Array.prototype.slice.call(gruppe.children).forEach(function (bild) {
      if (!gebraucht[bild.getAttribute('data-k')]) bild.remove();
    });

    clearTimeout(kachelLauf);
    kachelLauf = setTimeout(function () {
      Array.prototype.slice.call(ebeneKacheln.children).forEach(function (g) {
        if (g.getAttribute('data-z') !== String(z)) g.remove();
      });
    }, 400);
  }

  function kachelUrl(z, x, y) {
    return KACHEL_QUELLE.replace('{z}', z).replace('{x}', x).replace('{y}', y);
  }

  /**
   * Einzelne Aussetzer kommen vor - dann verschwindet nur diese Kachel. Kam
   * dagegen noch nie eine an, gibt es keine Straßenkarte (kein Netz, oder die
   * Umgebung lässt keine fremden Bilder zu) und die weiße Karte bleibt.
   */
  function kachelFehler(e) {
    if (kachelGeladen) { e.target.remove(); return; }
    if (++kachelFehlschlaege < 3) { e.target.remove(); return; }

    kachelnMoeglich = false;
    kachelnAn = false;
    ebeneKacheln.textContent = '';
    karte.classList.remove('mit-strassen');
    $('#kartenherkunft').hidden = true;
    $('#kartenhinweis').hidden = kachelZoom() < KACHEL_AB;
  }

  function zeichneLaender() {
    G.states.forEach(function (land) {
      var pfad = svg('path', { d: land.d, class: 'land' });
      pfad.appendChild(svg('title')).textContent = land.n;
      ebeneLaender.appendChild(pfad);
    });
  }

  function markerForm(art) {
    var teile = [];
    teile.push(svg('ellipse', { cx: 0, cy: 1, rx: 5, ry: 1.8, class: 'schatten' }));
    if (art === 'sitz') {
      teile.push(svg('path', {
        class: 'stift',
        d: 'M0 0 L-5 -8 H-10 A4 4 0 0 1 -14 -12 V-24 A4 4 0 0 1 -10 -28 H10 A4 4 0 0 1 14 -24 ' +
          'V-12 A4 4 0 0 1 10 -8 H5 Z'
      }));
      teile.push(svg('path', { class: 'kern', d: 'M-7 -17 L0 -24 L7 -17 V-11 H-7 Z' }));
    } else {
      teile.push(svg('path', {
        class: 'stift',
        d: 'M0 0 C -3.2 -7.5 -9 -10.5 -9 -17 A 9 9 0 1 1 9 -17 C 9 -10.5 3.2 -7.5 0 0 Z'
      }));
      if (art === 'fernaufschaltung') {
        // Funkwellen - die Anlage wird aus der Ferne erreicht.
        teile.push(svg('circle', { class: 'kern', cx: 0, cy: -14.6, r: 1.7 }));
        teile.push(svg('path', { class: 'welle', d: 'M-2.7 -17.4 A 3.6 3.6 0 0 1 2.7 -17.4' }));
        teile.push(svg('path', { class: 'welle', d: 'M-5 -19.4 A 6.6 6.6 0 0 1 5 -19.4' }));
      } else {
        teile.push(svg('circle', { class: 'kern', cx: 0, cy: -17, r: 3.6 }));
      }
    }
    teile.push(svg('circle', { class: 'treffer', cx: 0, cy: -15, r: 17 }));
    return teile;
  }

  function zeichneMarker() {
    ebeneMarker.textContent = '';
    alleOrte().forEach(function (ort) {
      var p = projiziere(ort.lat, ort.lon);
      var gruppe = svg('g', {
        class: 'marker ' + ort.art + (ort.id === gewaehlteId ? ' gewaehlt' : ''),
        'data-id': ort.id,
        'data-x': p.x,
        'data-y': p.y,
        tabindex: '0',
        role: 'button',
        'aria-label': ort.name
      });
      markerForm(ort.art).forEach(function (t) { gruppe.appendChild(t); });

      var beschriftung = svg('text', { class: 'name', x: 0, y: 14 });
      beschriftung.textContent = ort.name;
      gruppe.appendChild(beschriftung);

      gruppe.addEventListener('click', function (e) {
        e.stopPropagation();
        oeffneTafel(ort.id);
      });
      gruppe.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); oeffneTafel(ort.id); }
      });
      ebeneMarker.appendChild(gruppe);
    });
    setzeMarkerGroesse();
  }

  /** Marker sollen beim Zoomen gleich groß bleiben. */
  function setzeMarkerGroesse() {
    var faktor = 1 / ansicht.k;
    var namenZeigen = ansicht.k >= 2.4;
    Array.prototype.forEach.call(ebeneMarker.children, function (g) {
      g.setAttribute('transform',
        'translate(' + g.getAttribute('data-x') + ' ' + g.getAttribute('data-y') + ') scale(' + faktor + ')');
      var immer = g.classList.contains('sitz');
      g.classList.toggle('zeigt-namen', namenZeigen || immer);
    });
  }

  var kachelBild = 0;

  function wendeAn() {
    ebene.setAttribute('transform',
      'translate(' + ansicht.x + ' ' + ansicht.y + ') scale(' + ansicht.k + ')');
    setzeMarkerGroesse();

    if (!kachelBild) {
      kachelBild = requestAnimationFrame(function () {
        kachelBild = 0;
        zeichneKacheln();
      });
    }
  }

  function begrenze() {
    ansicht.k = Math.min(K_MAX, Math.max(K_MIN, ansicht.k));
    // Die Karte darf den sichtbaren Bereich nicht ganz verlassen.
    var rand = 0.75;
    var minX = -(G.w * ansicht.k) + G.w * (1 - rand);
    var maxX = G.w * rand;
    var minY = -(G.h * ansicht.k) + G.h * (1 - rand);
    var maxY = G.h * rand;
    ansicht.x = Math.min(maxX, Math.max(minX, ansicht.x));
    ansicht.y = Math.min(maxY, Math.max(minY, ansicht.y));
  }

  /** Bildschirmpunkt in Kartenkoordinaten des viewBox umrechnen. */
  function zuKarte(clientX, clientY) {
    var ctm = karte.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    var punkt = karte.createSVGPoint();
    punkt.x = clientX;
    punkt.y = clientY;
    return punkt.matrixTransform(ctm.inverse());
  }

  function zoomeAufPunkt(faktor, clientX, clientY) {
    var p = zuKarte(clientX, clientY);
    var vorher = ansicht.k;
    ansicht.k = Math.min(K_MAX, Math.max(K_MIN, ansicht.k * faktor));
    var echt = ansicht.k / vorher;
    ansicht.x = p.x - (p.x - ansicht.x) * echt;
    ansicht.y = p.y - (p.y - ansicht.y) * echt;
    begrenze();
    wendeAn();
  }

  function zoomeMittig(faktor) {
    var r = karte.getBoundingClientRect();
    zoomeAufPunkt(faktor, r.left + r.width / 2, r.top + r.height / 2);
  }

  var animation = null;

  /** Weicher Übergang zu einer Ansicht. */
  function animiereZu(zielX, zielY, zielK, dauer) {
    var startX = ansicht.x, startY = ansicht.y, startK = ansicht.k;
    var start = performance.now();
    var lauf = dauer || 520;
    cancelAnimationFrame(animation);

    (function schritt(jetzt) {
      var t = Math.min(1, (jetzt - start) / lauf);
      var e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      ansicht.k = startK + (zielK - startK) * e;
      ansicht.x = startX + (zielX - startX) * e;
      ansicht.y = startY + (zielY - startY) * e;
      begrenze();
      wendeAn();
      if (t < 1) animation = requestAnimationFrame(schritt);
    })(start);
  }

  function flieg(lat, lon, ziel_k) {
    var p = projiziere(lat, lon);
    var zielK = Math.min(K_MAX, Math.max(K_MIN, ziel_k));
    // Der Punkt soll in der Mitte des sichtbaren Kartenfelds landen.
    var mitte = sichtbareMitte();
    animiereZu(mitte.x - p.x * zielK, mitte.y - p.y * zielK, zielK);
  }

  /**
   * Mitte des Kartenfelds in viewBox-Koordinaten - berücksichtigt die
   * Detailtafel, damit der gewählte Marker nicht darunter verschwindet.
   */
  function sichtbareMitte() {
    var r = karte.getBoundingClientRect();
    var tafelBreite = 0;
    var tafel = $('#tafel');
    if (tafel.classList.contains('offen') && window.innerWidth > 900) {
      tafelBreite = tafel.getBoundingClientRect().width;
    }
    var links = zuKarte(r.left, r.top);
    var rechts = zuKarte(r.right - tafelBreite, r.bottom);
    return { x: (links.x + rechts.x) / 2, y: (links.y + rechts.y) / 2 };
  }

  function ganzeKarte() {
    cancelAnimationFrame(animation);
    ansicht = { x: 0, y: 0, k: 1 };
    wendeAn();
  }

  /* ---- Zurück zur Gesamtansicht, wenn niemand die Karte benutzt
   *
   * Gedacht für einen Bildschirm, an dem Leute vorbeikommen, etwas anschauen
   * und weitergehen: nach einer Weile ohne Bedienung stellt sich die Karte
   * wieder auf ganz Deutschland. Wer gerade im Mitarbeiterbereich etwas
   * einträgt, wird dabei nicht unterbrochen.
   */
  var ruheUhr = null;

  function istUebersicht() {
    return Math.abs(ansicht.k - 1) < 0.01 &&
      Math.abs(ansicht.x) < 0.5 && Math.abs(ansicht.y) < 0.5;
  }

  function ruheNeuStarten() {
    clearTimeout(ruheUhr);
    var sekunden = daten.einstellungen.ruheSekunden;
    if (!sekunden) return;
    ruheUhr = setTimeout(ruheAbgelaufen, sekunden * 1000);
  }

  function ruheAbgelaufen() {
    // Ein offener Dialog, ein groß betrachtetes Bild oder das Setzen einer
    // Position heißt: da schaut jemand hin. Dann wird nichts zurückgestellt,
    // sondern später noch einmal geschaut.
    var beschaeftigt = $('#schleier').classList.contains('offen') ||
      $('#lichtkasten').classList.contains('offen') || !!setzeModus;
    var schonRuhig = istUebersicht() && !sucheOffen &&
      !$('#tafel').classList.contains('offen');

    if (!beschaeftigt && !schonRuhig) {
      schliesseSuche();
      schliesseTafel();
      animiereZu(0, 0, 1, 900);
    }
    ruheNeuStarten();
  }

  ['pointerdown', 'wheel', 'keydown', 'touchstart'].forEach(function (art) {
    document.addEventListener(art, ruheNeuStarten, { passive: true });
  });

  /* ---- Ziehen, Rad und Zwei-Finger-Zoom */

  var zeiger = new Map();
  var zugStart = null;
  var kniffStart = null;
  var hatGezogen = false;

  // Der Zeiger wird erst eingefangen, wenn wirklich gezogen wird - sonst würde
  // der Browser den Klick auf einen Marker an das SVG umleiten.
  var eingefangen = null;

  function fangeEin(zeigerId) {
    if (eingefangen === zeigerId) return;
    try { karte.setPointerCapture(zeigerId); eingefangen = zeigerId; } catch (e) { /* egal */ }
  }

  karte.addEventListener('pointerdown', function (e) {
    zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });
    hatGezogen = false;
    if (zeiger.size === 1) {
      var p = zuKarte(e.clientX, e.clientY);
      zugStart = { p: p, x: ansicht.x, y: ansicht.y };
      karte.classList.add('zieht');
    } else if (zeiger.size === 2) {
      zeiger.forEach(function (_, id) { fangeEin(id); });
      kniffStart = kniffLage();
      kniffStart.k = ansicht.k;
      zugStart = null;
    }
  });

  karte.addEventListener('pointermove', function (e) {
    if (!zeiger.has(e.pointerId)) return;
    zeiger.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (zeiger.size === 2 && kniffStart) {
      var jetzt = kniffLage();
      if (kniffStart.abstand > 0) {
        var faktor = jetzt.abstand / kniffStart.abstand;
        ansicht.k = Math.min(K_MAX, Math.max(K_MIN, kniffStart.k * faktor));
        var echt = ansicht.k / kniffStart.k;
        ansicht.x = jetzt.p.x - (kniffStart.p.x - kniffStart.x0) * echt;
        ansicht.y = jetzt.p.y - (kniffStart.p.y - kniffStart.y0) * echt;
        begrenze();
        wendeAn();
      }
      hatGezogen = true;
      return;
    }

    if (zugStart) {
      var p = zuKarte(e.clientX, e.clientY);
      var dx = p.x - zugStart.p.x, dy = p.y - zugStart.p.y;
      if (Math.abs(dx) + Math.abs(dy) > 2) {
        hatGezogen = true;
        fangeEin(e.pointerId);
      }
      ansicht.x = zugStart.x + dx;
      ansicht.y = zugStart.y + dy;
      begrenze();
      wendeAn();
    }
  });

  function kniffLage() {
    var punkte = Array.from(zeiger.values());
    var mx = (punkte[0].x + punkte[1].x) / 2;
    var my = (punkte[0].y + punkte[1].y) / 2;
    var abstand = Math.hypot(punkte[0].x - punkte[1].x, punkte[0].y - punkte[1].y);
    var p = zuKarte(mx, my);
    return { p: p, abstand: abstand, x0: ansicht.x, y0: ansicht.y };
  }

  function zeigerEnde(e) {
    zeiger.delete(e.pointerId);
    if (eingefangen === e.pointerId) {
      try { karte.releasePointerCapture(e.pointerId); } catch (err) { /* egal */ }
      eingefangen = null;
    }
    if (zeiger.size < 2) kniffStart = null;
    if (zeiger.size === 0) {
      zugStart = null;
      karte.classList.remove('zieht');
    } else if (zeiger.size === 1) {
      var rest = Array.from(zeiger.values())[0];
      zugStart = { p: zuKarte(rest.x, rest.y), x: ansicht.x, y: ansicht.y };
    }
  }

  karte.addEventListener('pointerup', zeigerEnde);
  karte.addEventListener('pointercancel', zeigerEnde);

  karte.addEventListener('wheel', function (e) {
    e.preventDefault();
    var faktor = Math.pow(1.0025, -e.deltaY * (e.deltaMode === 1 ? 16 : 1));
    zoomeAufPunkt(faktor, e.clientX, e.clientY);
  }, { passive: false });

  karte.addEventListener('dblclick', function (e) {
    if (setzeModus) return;
    zoomeAufPunkt(2.2, e.clientX, e.clientY);
  });

  karte.addEventListener('click', function (e) {
    if (hatGezogen) return;
    var getroffen = e.target.closest ? e.target.closest('.marker') : null;
    if (getroffen && !setzeModus) { oeffneTafel(getroffen.getAttribute('data-id')); return; }
    if (setzeModus) {
      var p = zuKarte(e.clientX, e.clientY);
      var welt = { x: (p.x - ansicht.x) / ansicht.k, y: (p.y - ansicht.y) / ansicht.k };
      var koordinaten = entprojiziere(welt.x, welt.y);
      var rueckruf = setzeModus;
      beendeSetzen();
      rueckruf(koordinaten);
      return;
    }
    if (e.target === karte || e.target.classList.contains('land')) schliesseTafel();
  });

  $('#knopfPlus').onclick = function () { zoomeMittig(2); };
  $('#knopfMinus').onclick = function () { zoomeMittig(0.5); };
  $('#knopfHeim').onclick = ganzeKarte;

  /* ---- Position auf der Karte wählen */

  function starteSetzen(rueckruf, hinweis) {
    setzeModus = rueckruf;
    karte.classList.add('setzt');
    var leiste = h('div', { class: 'hinweisleiste', id: 'setzHinweis' },
      hinweis || 'Auf die Karte klicken, um die Position zu setzen',
      h('button', {
        class: 'knopf klein', onclick: function () {
          beendeSetzen();
          if (abbruchSetzen) abbruchSetzen();
        }
      }, 'Abbrechen'));
    $('#kartenfeld').appendChild(leiste);
  }

  var abbruchSetzen = null;

  function beendeSetzen() {
    setzeModus = null;
    karte.classList.remove('setzt');
    var leiste = $('#setzHinweis');
    if (leiste) leiste.remove();
  }

  /* ------------------------------------------------------------ Suche */

  var suchtext = '';

  function passt(ort) {
    if (!suchtext) return true;
    var s = suchtext.toLowerCase();
    return (ort.name + ' ' + ort.ort).toLowerCase().indexOf(s) >= 0;
  }

  function zeichneListe() {
    var behaelter = $('#liste');
    behaelter.textContent = '';
    var etwasGefunden = false;

    ['sitz', 'projekt', 'fernaufschaltung'].forEach(function (art) {
      var treffer = listeFuer(art).filter(passt);
      if (art !== 'sitz') {
        treffer = treffer.slice().sort(function (a, b) {
          return a.name.localeCompare(b.name, 'de');
        });
      }
      if (!treffer.length) return;
      etwasGefunden = true;

      behaelter.appendChild(h('div', {
        class: 'listen-titel',
        text: ARTEN[art].mehrzahl + (art === 'sitz' ? '' : ' (' + treffer.length + ')')
      }));
      treffer.forEach(function (e) { behaelter.appendChild(listenEintrag(e, art)); });
    });

    if (!etwasGefunden) {
      behaelter.appendChild(h('div', { class: 'leer', text: 'Nichts gefunden.' }));
    }
  }

  function listenEintrag(ort, art) {
    return h('button', {
      class: 'eintrag ' + art + (ort.id === gewaehlteId ? ' aktiv' : ''),
      onclick: function () {
        schliesseSuche();
        oeffneTafel(ort.id);
      }
    },
      h('span', { class: 'punkt' }),
      h('span', { class: 'beschriftung' },
        h('span', { class: 'name', text: ort.name }),
        ort.ort ? h('span', { class: 'ort', text: ort.ort }) : null));
  }

  var sucheOffen = false;

  function oeffneSuche() {
    sucheOffen = true;
    $('#suchtafel').classList.add('offen');
    $('#knopfSuche').setAttribute('aria-expanded', 'true');
    var eingabe = $('#suche');
    eingabe.focus();
    eingabe.select();
  }

  function schliesseSuche() {
    if (!sucheOffen) return;
    sucheOffen = false;
    $('#suchtafel').classList.remove('offen');
    $('#knopfSuche').setAttribute('aria-expanded', 'false');
  }

  $('#knopfSuche').onclick = function () {
    if (sucheOffen) schliesseSuche();
    else oeffneSuche();
  };

  $('#suche').addEventListener('input', function (e) {
    suchtext = e.target.value.trim();
    zeichneListe();
  });

  /** Mit Pfeiltasten durch die Treffer, mit Enter öffnen. */
  $('#suche').addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { schliesseSuche(); return; }

    var treffer = Array.prototype.slice.call($('#liste').querySelectorAll('.eintrag'));
    if (!treffer.length) return;
    var jetzt = treffer.indexOf($('#liste').querySelector('.eintrag.markiert'));

    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      var naechster = e.key === 'ArrowDown'
        ? (jetzt + 1) % treffer.length
        : (jetzt <= 0 ? treffer.length - 1 : jetzt - 1);
      treffer.forEach(function (t) { t.classList.remove('markiert'); });
      treffer[naechster].classList.add('markiert');
      treffer[naechster].scrollIntoView({ block: 'nearest' });
      return;
    }

    if (e.key === 'Enter') {
      e.preventDefault();
      (treffer[jetzt >= 0 ? jetzt : 0]).click();
    }
  });

  // Ein Klick neben die Tafel schließt sie.
  document.addEventListener('pointerdown', function (e) {
    if (!sucheOffen) return;
    if ($('#suchtafel').contains(e.target) || $('#knopfSuche').contains(e.target)) return;
    schliesseSuche();
  });

  /* ------------------------------------------------------------ Detailtafel */

  function oeffneTafel(id) {
    var ort = findeOrt(id);
    if (!ort) return;
    gewaehlteId = id;

    var inhalt = $('#tafelInhalt');
    inhalt.textContent = '';
    inhalt.scrollTop = 0;

    inhalt.appendChild(h('img', {
      class: 'titelbild', src: bildQuelle(ort), alt: ort.name
    }));

    var text = h('div', { class: 'tafel-text' });
    text.appendChild(h('span', {
      class: 'tafel-marke ' + ort.art,
      text: ARTEN[ort.art].einzahl
    }));
    text.appendChild(h('h2', { text: ort.name }));
    if (ort.ort) text.appendChild(h('div', { class: 'unterzeile', text: ort.ort }));

    var fakten = ort.fakten.filter(function (f) { return f.label || f.wert; });
    if (fakten.length) {
      var raster = h('dl', { class: 'eckdaten' });
      fakten.forEach(function (f) {
        raster.appendChild(h('div', null,
          h('dt', { text: f.label }),
          h('dd', { text: f.wert || '—' })));
      });
      text.appendChild(raster);
    }

    if (ort.text) {
      var beschreibung = h('div', { class: 'beschreibung' });
      ort.text.split(/\n\s*\n/).forEach(function (absatz) {
        var p = h('p');
        absatz.split('\n').forEach(function (zeile, i) {
          if (i) p.appendChild(document.createElement('br'));
          p.appendChild(document.createTextNode(zeile));
        });
        beschreibung.appendChild(p);
      });
      text.appendChild(beschreibung);
    }

    if (ort.bilder.length) {
      text.appendChild(h('div', { class: 'abschnitt-titel', text: 'Bilder' }));
      var galerie = h('div', { class: 'galerie' });
      ort.bilder.forEach(function (bild, i) {
        galerie.appendChild(h('figure', null,
          h('img', {
            src: bild.src, alt: bild.text || ort.name, loading: 'lazy',
            onclick: function () { oeffneLichtkasten(ort.bilder, i); }
          }),
          bild.text ? h('figcaption', { text: bild.text }) : null));
      });
      text.appendChild(galerie);
    }

    if (freigegeben) {
      text.appendChild(h('div', { class: 'abschnitt-titel', text: 'Mitarbeiterbereich' }));
      text.appendChild(h('button', {
        class: 'knopf', onclick: function () {
          oeffneEditor(ort.art, JSON.parse(JSON.stringify(ort)), false);
        }
      }, 'Diesen Eintrag bearbeiten'));
    }

    inhalt.appendChild(text);

    var tafel = $('#tafel');
    tafel.classList.add('offen');
    tafel.setAttribute('aria-hidden', 'false');
    $('#kartenfeld').classList.add('tafel-offen');

    zeichneMarker();
    zeichneListe();
    flieg(ort.lat, ort.lon, Math.max(ansicht.k, 24));
  }

  function schliesseTafel() {
    var tafel = $('#tafel');
    tafel.classList.remove('offen');
    tafel.setAttribute('aria-hidden', 'true');
    $('#kartenfeld').classList.remove('tafel-offen');
    gewaehlteId = null;
    zeichneMarker();
    zeichneListe();
  }

  $('#tafelSchliessen').onclick = schliesseTafel;

  /* ------------------------------------------------------------ Bildansicht */

  var lkBilder = [], lkNummer = 0;

  function oeffneLichtkasten(bilder, nummer) {
    lkBilder = bilder;
    lkNummer = nummer;
    zeigeLichtkastenBild();
    $('#lichtkasten').classList.add('offen');
  }

  function zeigeLichtkastenBild() {
    var bild = lkBilder[lkNummer];
    if (!bild) return;
    $('#lkBild').src = bild.src;
    $('#lkText').textContent = bild.text || '';
    var mehrere = lkBilder.length > 1;
    $('#lkVor').style.display = mehrere ? '' : 'none';
    $('#lkZurueck').style.display = mehrere ? '' : 'none';
  }

  function blaettere(richtung) {
    if (!lkBilder.length) return;
    lkNummer = (lkNummer + richtung + lkBilder.length) % lkBilder.length;
    zeigeLichtkastenBild();
  }

  function schliesseLichtkasten() { $('#lichtkasten').classList.remove('offen'); }

  $('#lkZu').onclick = schliesseLichtkasten;
  $('#lkVor').onclick = function () { blaettere(1); };
  $('#lkZurueck').onclick = function () { blaettere(-1); };
  $('#lichtkasten').addEventListener('click', function (e) {
    if (e.target === this) schliesseLichtkasten();
  });

  document.addEventListener('keydown', function (e) {
    if ($('#lichtkasten').classList.contains('offen')) {
      if (e.key === 'Escape') schliesseLichtkasten();
      if (e.key === 'ArrowRight') blaettere(1);
      if (e.key === 'ArrowLeft') blaettere(-1);
      return;
    }
    if (e.key !== 'Escape') return;
    if ($('#schleier').classList.contains('offen')) schliesseDialog();
    else if (sucheOffen) schliesseSuche();
    else if (setzeModus) { beendeSetzen(); if (abbruchSetzen) abbruchSetzen(); }
    else schliesseTafel();
  });

  /* ------------------------------------------------------------ Dialog */

  function zeigeDialog(einstellung) {
    $('#dialogTitel').textContent = einstellung.titel || '';
    var koerper = $('#dialogKoerper');
    var fuss = $('#dialogFuss');
    koerper.textContent = '';
    fuss.textContent = '';
    koerper.scrollTop = 0;
    anhaengen(koerper, einstellung.inhalt);
    anhaengen(fuss, einstellung.knoepfe || []);
    $('#dialog').classList.toggle('breit', !!einstellung.breit);
    $('#schleier').classList.add('offen');
    var erstes = koerper.querySelector('input, textarea, select');
    if (erstes && einstellung.fokus !== false) setTimeout(function () { erstes.focus(); }, 60);
  }

  function schliesseDialog() {
    $('#schleier').classList.remove('offen');
  }

  $('#dialogSchliessen').onclick = schliesseDialog;
  $('#schleier').addEventListener('mousedown', function (e) {
    if (e.target === this) schliesseDialog();
  });

  function feld(beschriftung, eingabe, hilfe) {
    return h('div', { class: 'feld' },
      beschriftung ? h('label', { text: beschriftung }) : null,
      eingabe,
      hilfe ? h('div', { class: 'hilfe', text: hilfe }) : null);
  }

  /* ------------------------------------------------------------ Anmeldung */

  $('#knopfMitarbeiter').onclick = function () {
    if (freigegeben) oeffneVerwaltung('projekt');
    else frageKennwort();
  };

  function frageKennwort() {
    var eingabe = h('input', { type: 'password', id: 'kw', autocomplete: 'current-password' });
    var meldungsfeld = h('div');

    function pruefe() {
      passwortStimmt(eingabe.value).then(function (ok) {
        if (!ok) {
          meldungsfeld.textContent = '';
          meldungsfeld.appendChild(h('div', { class: 'fehler', text: 'Kennwort stimmt nicht.' }));
          eingabe.value = '';
          eingabe.focus();
          return;
        }
        schalteFrei(true);
        schliesseDialog();
        melde('Mitarbeiterbereich freigeschaltet');
        oeffneVerwaltung('projekt');
      });
    }

    eingabe.addEventListener('keydown', function (e) { if (e.key === 'Enter') pruefe(); });

    zeigeDialog({
      titel: 'Mitarbeiterbereich',
      inhalt: [

        feld('Kennwort', eingabe,
          daten.einstellungen.passwortHash

            : 'Noch kein eigenes Kennwort gesetzt - es gilt „' + STANDARD_PASSWORT +
              '“. Bitte in den Einstellungen ändern.')
      ],
      knoepfe: [
        h('button', { class: 'knopf', onclick: schliesseDialog }, 'Abbrechen'),
        h('button', { class: 'knopf haupt', onclick: pruefe }, 'Anmelden')

  /* ------------------------------------------------------------ Verwaltung */

  function oeffneVerwaltung(reiter) {
    var inhalt = h('div');

    function baue() {
      inhalt.textContent = '';
      var leiste = h('div', { class: 'reiter', style: 'margin:-20px -20px 16px;padding:0 4px;' });
      ['projekt', 'sitz', 'fernaufschaltung', 'einstellungen'].forEach(function (r) {
        leiste.appendChild(h('button', {
          class: reiter === r ? 'aktiv' : '',
          onclick: function () { reiter = r; baue(); }
        }, r === 'einstellungen' ? 'Einstellungen' : ARTEN[r].mehrzahl));
      });
      inhalt.appendChild(leiste);

      if (reiter === 'einstellungen') inhalt.appendChild(baueEinstellungen());
      else inhalt.appendChild(baueEintragsliste(reiter));

    zeigeDialog({
      titel: 'Mitarbeiterbereich',

      fokus: false,

      knoepfe: [
        h('button', {
          class: 'knopf leise', onclick: function () {
            schalteFrei(false);
            schliesseDialog();
            zeichneListe();
            if (gewaehlteId) oeffneTafel(gewaehlteId);
            melde('Abgemeldet');
          }
        }, 'Abmelden'),
        h('button', { class: 'knopf haupt', onclick: schliesseDialog }, 'Fertig')
      ]
    });
  }

  function baueEintragsliste(art) {
    var eintraege = listeFuer(art);
    var behaelter = h('div');

    behaelter.appendChild(h('div', {
      style: 'display:flex;align-items:center;gap:12px;margin-bottom:14px;'
    },
      h('div', { style: 'flex:1;color:var(--text-leise);font-size:13px;' },
        eintraege.length + ' ' + (eintraege.length === 1
          ? ARTEN[art].einzahl : ARTEN[art].mehrzahl)),
      h('button', {
        class: 'knopf haupt', onclick: function () { oeffneEditor(art, leererEintrag(art), true); }
      }, '+ ' + ARTEN[art].einzahl)));

    if (!eintraege.length) {
      behaelter.appendChild(h('div', { class: 'leer', text: 'Noch nichts angelegt.' }));
      return behaelter;
    }

    var liste = h('div', { class: 'verwaltung-liste' });
    eintraege.forEach(function (e, i) {
      liste.appendChild(h('div', { class: 'verwaltung-zeile' },
        h('img', { src: bildQuelle(Object.assign({ art: art }, e)), alt: '' }),
        h('div', { class: 'beschriftung' },
          h('div', { class: 'name', text: e.name }),
          h('div', {
            class: 'ort',
            text: (e.ort ? e.ort + ' · ' : '') + e.lat.toFixed(4) + ', ' + e.lon.toFixed(4) +
              ' · ' + e.bilder.length + ' Bilder'
          })),
        h('button', {
          class: 'knopf klein', onclick: function () {
            oeffneEditor(art, JSON.parse(JSON.stringify(e)), false);
          }
        }, 'Bearbeiten'),
        h('button', {
          class: 'knopf klein gefahr', onclick: function () { frageLoeschen(art, i); }

  function leererEintrag(art) {
    var felder = ARTEN[art].felder;
    return {
      id: neueId(), name: '', ort: '', lat: 51.2, lon: 10.4, titelbild: '',

  function frageLoeschen(art, nummer) {

    zeigeDialog({

      ]
    });

  /* ------------------------------------------------------------ Bilder */

  /** Datei einlesen, auf Kantenlänge begrenzen und als Data-URL zurückgeben. */
  function leseBild(datei, maxKante) {
    return new Promise(function (fertig, fehler) {
      if (!/^image\//.test(datei.type)) return fehler(new Error('Keine Bilddatei'));
      var leser = new FileReader();
      leser.onerror = function () { fehler(new Error('Datei nicht lesbar')); };
      leser.onload = function () {
        var bild = new Image();
        bild.onerror = function () { fehler(new Error('Bild nicht lesbar')); };
        bild.onload = function () {
          var faktor = Math.min(1, maxKante / Math.max(bild.width, bild.height));
          var breite = Math.max(1, Math.round(bild.width * faktor));
          var hoehe = Math.max(1, Math.round(bild.height * faktor));
          var flaeche = document.createElement('canvas');
          flaeche.width = breite;
          flaeche.height = hoehe;
          var stift = flaeche.getContext('2d');
          stift.fillStyle = '#fff';
          stift.fillRect(0, 0, breite, hoehe);
          stift.drawImage(bild, 0, 0, breite, hoehe);
          fertig(flaeche.toDataURL('image/jpeg', 0.82));
        };
        bild.src = leser.result;
      };
      leser.readAsDataURL(datei);
    });
  }

  function dateiWaehler(mehrere, beiAuswahl) {
    var eingabe = h('input', {
      type: 'file', accept: 'image/*', style: 'display:none', multiple: mehrere || null
    });
    eingabe.addEventListener('change', function () {
      var dateien = Array.prototype.slice.call(eingabe.files);
      eingabe.value = '';
      if (dateien.length) beiAuswahl(dateien);
    });
    return eingabe;
  }

  /* ------------------------------------------------------------ Editor */

  function oeffneEditor(art, entwurf, istNeu) {

    var nameFeld = h('input', { type: 'text', value: entwurf.name, placeholder: 'z. B. Wohnquartier Nordpark' });
    var ortFeld = h('input', { type: 'text', value: entwurf.ort, placeholder: 'z. B. Hamburg, Hamburg' });
    var latFeld = h('input', { type: 'text', value: entwurf.lat, inputmode: 'decimal' });
    var lonFeld = h('input', { type: 'text', value: entwurf.lon, inputmode: 'decimal' });

    function uebernehmen() {
      entwurf.name = nameFeld.value.trim();
      entwurf.ort = ortFeld.value.trim();
      entwurf.lat = zahl(latFeld.value, entwurf.lat);
      entwurf.lon = zahl(lonFeld.value, entwurf.lon);
      entwurf.text = textFeld.value;
      entwurf.fakten = faktenAuslesen();
    }

    /* Titelbild */
    var titelVorschau = h('img', {
      class: 'vorschau-titelbild', alt: '',
      src: entwurf.titelbild || platzhalter(entwurf.name || '?', ARTEN[art].ton)
    });
    var titelWaehler = dateiWaehler(false, function (dateien) {
      leseBild(dateien[0], 1600).then(function (quelle) {
        entwurf.titelbild = quelle;
        titelVorschau.src = quelle;
      }).catch(function () { melde('Bild konnte nicht gelesen werden.'); });
    });

    /* Eckdaten */
    var faktenListe = h('div');

    function faktenZeile(fakt) {
      var label = h('input', { type: 'text', value: fakt.label, placeholder: 'Bezeichnung' });
      var wert = h('input', { type: 'text', value: fakt.wert, placeholder: 'Wert' });
      var zeile = h('div', { class: 'daten-reihe' },
        label, wert,
        h('button', {
          class: 'knopf klein', title: 'Nach oben', onclick: function () {
            var vorher = zeile.previousElementSibling;
            if (vorher) faktenListe.insertBefore(zeile, vorher);
          }
        }, '↑'),
        h('button', {
          class: 'knopf klein', title: 'Nach unten', onclick: function () {
            var danach = zeile.nextElementSibling;
            if (danach) faktenListe.insertBefore(danach, zeile);
          }
        }, '↓'),
        h('button', {
          class: 'knopf klein gefahr', title: 'Zeile entfernen',
          onclick: function () { zeile.remove(); }
        }, '×'));
      zeile._label = label;
      zeile._wert = wert;
      return zeile;
    }

    function faktenAuslesen() {
      return Array.prototype.map.call(faktenListe.children, function (zeile) {
        return { label: zeile._label.value.trim(), wert: zeile._wert.value.trim() };
      }).filter(function (f) { return f.label || f.wert; });
    }

    entwurf.fakten.forEach(function (f) { faktenListe.appendChild(faktenZeile(f)); });

    /* Beschreibung */
    var textFeld = h('textarea', {
      placeholder: 'Beschreibung des Projekts. Leerzeile trennt Absätze.'
    });
    textFeld.value = entwurf.text;

    /* Weitere Bilder */
    var bilderListe = h('div');

    function bildZeile(bild) {
      var beschriftung = h('input', { type: 'text', value: bild.text, placeholder: 'Bildunterschrift (optional)' });
      var zeile = h('div', { class: 'bild-reihe' },
        h('img', { src: bild.src, alt: '' }),
        beschriftung,
        h('button', {
          class: 'knopf klein', title: 'Nach vorn', onclick: function () {
            var vorher = zeile.previousElementSibling;
            if (vorher) bilderListe.insertBefore(zeile, vorher);
          }
        }, '↑'),
        h('button', {
          class: 'knopf klein gefahr', onclick: function () { zeile.remove(); }
        }, 'Entfernen'));
      zeile._src = bild.src;
      zeile._text = beschriftung;
      return zeile;
    }

    function bilderAuslesen() {
      return Array.prototype.map.call(bilderListe.children, function (zeile) {
        return { src: zeile._src, text: zeile._text.value.trim() };
      });
    }

    entwurf.bilder.forEach(function (b) { bilderListe.appendChild(bildZeile(b)); });

    var bilderWaehler = dateiWaehler(true, function (dateien) {
      Promise.all(dateien.map(function (d) { return leseBild(d, 1400).catch(function () { return null; }); }))
        .then(function (quellen) {
          quellen.filter(Boolean).forEach(function (q) {
            bilderListe.appendChild(bildZeile({ src: q, text: '' }));
          });
          melde(quellen.filter(Boolean).length + ' Bild(er) hinzugefügt');
        });
    });

    /* Speichern */
    function speichereEintrag() {
      uebernehmen();
      entwurf.bilder = bilderAuslesen();
      if (!entwurf.name) { melde('Bitte einen Namen eintragen.'); nameFeld.focus(); return; }

      var liste = listeFuer(art);
      var nummer = -1;
      liste.forEach(function (e, i) { if (e.id === entwurf.id) nummer = i; });
      if (nummer >= 0) liste[nummer] = eintragAufraeumen(entwurf);
      else liste.push(eintragAufraeumen(entwurf));

      if (!speichern()) return;
      zeichneMarker();
      zeichneListe();
      if (gewaehlteId === entwurf.id) oeffneTafel(entwurf.id);
      melde(istNeu ? 'Angelegt' : 'Gespeichert');
      oeffneVerwaltung(art);
    }

    zeigeDialog({
      titel: (istNeu ? 'Neu anlegen: ' : 'Bearbeiten: ') + ARTEN[art].einzahl,
      breit: true,
      inhalt: [
        h('div', { class: 'reihe' },
          feld('Name', nameFeld),
          feld('Ort / Untertitel', ortFeld)),

        h('div', { class: 'abschnitt-titel', text: 'Position auf der Karte' }),
        h('div', { class: 'reihe' },
          feld('Breitengrad', latFeld),
          feld('Längengrad', lonFeld)),
        h('div', { style: 'margin:-4px 0 18px;' },
          h('button', {
            class: 'knopf', onclick: function () {
              uebernehmen();
              entwurf.bilder = bilderAuslesen();
              schliesseDialog();
              abbruchSetzen = function () { oeffneEditor(art, entwurf, istNeu); };
              starteSetzen(function (koordinaten) {
                entwurf.lat = koordinaten.lat;
                entwurf.lon = koordinaten.lon;
                oeffneEditor(art, entwurf, istNeu);
                melde('Position übernommen');
              }, 'Auf die Karte klicken, um „' + (entwurf.name || 'den Eintrag') + '“ zu setzen');
            }
          }, '📍 Position auf der Karte wählen')),

        h('div', { class: 'abschnitt-titel', text: 'Titelbild' }),
        titelVorschau,
        h('div', { style: 'display:flex;gap:8px;margin-bottom:6px;' },
          h('button', { class: 'knopf', onclick: function () { titelWaehler.click(); } }, 'Bild auswählen'),
          h('button', {
            class: 'knopf leise', onclick: function () {
              entwurf.titelbild = '';
              titelVorschau.src = platzhalter(nameFeld.value || '?', ARTEN[art].ton);
            }
          }, 'Entfernen')),
        titelWaehler,
        h('div', { class: 'hilfe', text: 'Bilder werden automatisch auf 1600 px verkleinert.' }),

        h('div', { class: 'abschnitt-titel', text: 'Eckdaten' }),
        faktenListe,
        h('button', {
          class: 'knopf klein', onclick: function () {
            faktenListe.appendChild(faktenZeile({ label: '', wert: '' }));
          }
        }, '+ Zeile hinzufügen'),
        h('div', { class: 'hilfe', text: 'Bezeichnung und Wert sind frei wählbar - so lassen sich später beliebige Kennzahlen ergänzen.' }),

        h('div', { class: 'abschnitt-titel', text: 'Beschreibung' }),
        textFeld,

        h('div', { class: 'abschnitt-titel', text: 'Weitere Bilder' }),
        bilderListe,
        h('button', { class: 'knopf klein', onclick: function () { bilderWaehler.click(); } },
          '+ Bilder hinzufügen'),
        bilderWaehler
      ],
      knoepfe: [
        h('button', {
          class: 'knopf', onclick: function () { oeffneVerwaltung(art); }
        }, 'Abbrechen'),
        h('button', { class: 'knopf haupt', onclick: speichereEintrag }, 'Speichern')
      ]
    });
  }

  /* ------------------------------------------------------------ Einstellungen */

  function baueEinstellungen() {
    var behaelter = h('div');

    /* Seitentitel */
    var titelFeld = h('input', { type: 'text', value: daten.einstellungen.seitentitel });
    behaelter.appendChild(h('div', { class: 'abschnitt-titel', text: 'Überschrift der Seite' }));
    behaelter.appendChild(feld(null, titelFeld));
    behaelter.appendChild(h('button', {
      class: 'knopf klein', onclick: function () {
        daten.einstellungen.seitentitel = titelFeld.value.trim() || 'Unsere Projekte in Deutschland';
        if (speichern()) {
          $('#seitentitel').textContent = daten.einstellungen.seitentitel;
          document.title = daten.einstellungen.seitentitel;
          melde('Überschrift gespeichert');
        }
      }
    }, 'Überschrift speichern'));

    /* Rückkehr zur Gesamtansicht */
    var ruheFeld = h('input', {
      type: 'number', min: '0', max: '3600', step: '5',
      value: daten.einstellungen.ruheSekunden
    });
    behaelter.appendChild(h('div', {
      class: 'abschnitt-titel', text: 'Automatisch zurück zur Gesamtansicht'
    }));
    behaelter.appendChild(feld('Nach wie vielen Sekunden ohne Bedienung?', ruheFeld,
      'Die Karte schließt dann Suche und Detailtafel und stellt sich wieder auf ganz ' +
      'Deutschland – gedacht für einen Bildschirm, an dem Leute vorbeikommen. ' +
      'Wer gerade im Mitarbeiterbereich etwas einträgt, wird nicht unterbrochen. ' +
      '0 schaltet die Rückkehr ab.'));
    behaelter.appendChild(h('button', {
      class: 'knopf klein', onclick: function () {
        var sekunden = Math.max(0, Math.min(3600, Math.round(zahl(ruheFeld.value, RUHE_STANDARD))));
        daten.einstellungen.ruheSekunden = sekunden;
        ruheFeld.value = sekunden;
        if (speichern()) {
          ruheNeuStarten();
          melde(sekunden ? 'Rückkehr nach ' + sekunden + ' Sekunden' : 'Rückkehr abgeschaltet');
        }
      }
    }, 'Übernehmen'));

    /* Kennwort */
    var altFeld = h('input', { type: 'password', autocomplete: 'current-password' });
    var neuFeld = h('input', { type: 'password', autocomplete: 'new-password' });
    var wiederFeld = h('input', { type: 'password', autocomplete: 'new-password' });
    var kwMeldung = h('div');

    function kwHinweis(klasse, text) {
      kwMeldung.textContent = '';
      kwMeldung.appendChild(h('div', { class: klasse, text: text }));
    }

    behaelter.appendChild(h('div', { class: 'abschnitt-titel', text: 'Kennwort für den Mitarbeiterbereich' }));
    behaelter.appendChild(kwMeldung);
    behaelter.appendChild(feld('Bisheriges Kennwort', altFeld,
      daten.einstellungen.passwortHash ? null : 'Zurzeit gilt das Standardkennwort „' + STANDARD_PASSWORT + '“.'));
    behaelter.appendChild(h('div', { class: 'reihe' },
      feld('Neues Kennwort', neuFeld),
      feld('Neues Kennwort wiederholen', wiederFeld)));
    behaelter.appendChild(h('button', {
      class: 'knopf klein', onclick: function () {
        if (neuFeld.value.length < 4) return kwHinweis('fehler', 'Das neue Kennwort ist zu kurz (mindestens 4 Zeichen).');
        if (neuFeld.value !== wiederFeld.value) return kwHinweis('fehler', 'Die beiden neuen Kennwörter stimmen nicht überein.');
        passwortStimmt(altFeld.value).then(function (ok) {
          if (!ok) return kwHinweis('fehler', 'Das bisherige Kennwort stimmt nicht.');
          hashe(neuFeld.value).then(function (hash) {
            daten.einstellungen.passwortHash = hash;
            if (speichern()) {
              altFeld.value = neuFeld.value = wiederFeld.value = '';
              kwHinweis('erfolg', 'Kennwort geändert.');
              melde('Kennwort geändert');
            }
          });
        });
      }
    }, 'Kennwort ändern'));

    behaelter.appendChild(h('div', {
      class: 'hilfe',
      style: 'margin-top:8px;',
      text: 'Hinweis: Der Schutz läuft im Browser und hält Unbeteiligte fern. ' +
        'Wer die Daten wirklich absichern will, betreibt die Seite hinter einer ' +
        'echten Anmeldung auf dem Server.'
    }));

    /* Sicherung */
    behaelter.appendChild(h('div', { class: 'abschnitt-titel', text: 'Daten sichern und übertragen' }));
    behaelter.appendChild(h('div', {
      class: 'hilfe', style: 'margin-bottom:10px;',
      text: 'Alle Einträge liegen nur in diesem Browser. Für eine Sicherung oder den ' +
        'Wechsel auf einen anderen Rechner die Daten als Datei exportieren.'
    }));

    var einleseWaehler = h('input', { type: 'file', accept: 'application/json,.json', style: 'display:none' });
    einleseWaehler.addEventListener('change', function () {
      var datei = einleseWaehler.files[0];
      einleseWaehler.value = '';
      if (!datei) return;
      var leser = new FileReader();
      leser.onload = function () {
        try {
          var eingelesen = raeumeAuf(JSON.parse(leser.result));
        } catch (e) {
          melde('Datei konnte nicht gelesen werden.');
          return;
        }
        zeigeDialog({
          titel: 'Daten einlesen',
          inhalt: h('p', {
            text: 'Die Datei enthält ' + eingelesen.sitze.length + ' Betriebssitze, ' +
              eingelesen.projekte.length + ' Projekte und ' +
              eingelesen.fernaufschaltungen.length + ' Fernaufschaltungen. ' +
              'Der jetzige Stand wird dabei ersetzt.'
          }),
          knoepfe: [
            h('button', { class: 'knopf', onclick: function () { oeffneVerwaltung('einstellungen'); } }, 'Abbrechen'),
            h('button', {
              class: 'knopf haupt', onclick: function () {
                // Ein bereits gesetztes Kennwort bleibt erhalten.
                eingelesen.einstellungen.passwortHash =
                  eingelesen.einstellungen.passwortHash || daten.einstellungen.passwortHash;
                daten = eingelesen;
                speichern();
                schliesseTafel();
                $('#seitentitel').textContent = daten.einstellungen.seitentitel;
                zeichneMarker();
                zeichneListe();
                ganzeKarte();
                melde('Daten eingelesen');
                oeffneVerwaltung('einstellungen');
              }
            }, 'Jetzt ersetzen')
          ]
        });
      };
      leser.readAsText(datei);
    });

    behaelter.appendChild(h('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;' },
      h('button', { class: 'knopf klein', onclick: exportiere }, '⬇ Daten exportieren (JSON)'),
      h('button', { class: 'knopf klein', onclick: function () { einleseWaehler.click(); } },
        '⬆ Daten einlesen'),
      einleseWaehler,
      h('button', {
        class: 'knopf klein gefahr', onclick: function () {
          zeigeDialog({
            titel: 'Auf Demodaten zurücksetzen?',
            inhalt: h('p', {
              text: 'Alle Projekte, Betriebssitze, Fernaufschaltungen und Bilder werden ' +
                'gelöscht und durch die Beispieldaten ersetzt. Vorher am besten exportieren.'
            }),
            knoepfe: [
              h('button', { class: 'knopf', onclick: function () { oeffneVerwaltung('einstellungen'); } }, 'Abbrechen'),
              h('button', {
                class: 'knopf gefahr', onclick: function () {
                  var altesKennwort = daten.einstellungen.passwortHash;
                  daten = demodaten();
                  daten.einstellungen.passwortHash = altesKennwort;
                  speichern();
                  schliesseTafel();
                  zeichneMarker();
                  zeichneListe();
                  ganzeKarte();
                  melde('Zurückgesetzt');
                  oeffneVerwaltung('einstellungen');
                }
              }, 'Zurücksetzen')
            ]
          });
        }
      }, 'Auf Demodaten zurücksetzen')));

    /* Speicherbedarf */
    var bytes = speicherGroesse();
    var anteil = Math.min(100, Math.round(bytes / 5e6 * 100));
    behaelter.appendChild(h('div', { class: 'abschnitt-titel', text: 'Speicherbedarf' }));
    behaelter.appendChild(h('div', { class: 'speicher-balken' },
      h('i', { style: 'width:' + anteil + '%' })));
    behaelter.appendChild(h('div', {
      class: 'hilfe',
      text: (bytes / 1048576).toFixed(2) + ' MB von etwa 5 MB, die ein Browser je Seite ' +
        'freigibt. Wird es eng, hilft ein Export und weniger große Bilder.'
    }));

    return behaelter;
  }

  function exportiere() {
    var text = JSON.stringify(daten, null, 2);
    var blob = new Blob([text], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var heute = new Date().toISOString().slice(0, 10);
    var verweis = h('a', { href: url, download: 'projektkarte-' + heute + '.json' });
    document.body.appendChild(verweis);
    verweis.click();
    verweis.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    melde('Export gestartet');
  }

  /* ------------------------------------------------------------ Start */

  $('#seitentitel').textContent = daten.einstellungen.seitentitel;
  document.title = daten.einstellungen.seitentitel;
  zeichneLaender();
  zeichneMarker();
  zeichneListe();
  wendeAn();
  ruheNeuStarten();

  window.addEventListener('resize', setzeMarkerGroesse);
})();
</script>
</body>
</html>
